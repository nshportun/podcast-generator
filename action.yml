name: "Podcast Generator NS"
author: "nshportun"
description: "generates feed"
runs:
  using: docker
  image: "DockerFile"
branding:
  icon: git-branch
  color: red
inputs:
  email: 
    description: The commiter email
    required: true
    default: ${{github.actor}}@localhost
  name:
    description: The commiter name
    required: true
    default: ${{github.actor}}
